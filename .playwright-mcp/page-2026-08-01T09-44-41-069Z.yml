    - generic [ref=e9]:
      - generic [ref=e10]:
        - paragraph [ref=e11]: Persistent interview report · 001
        - heading "Chiang Mai Lifestyle" [level=1] [ref=e12]
        - paragraph [ref=e14]: The participant is a Chiang Mai resident and event emcee who seeks experiences both for personal enjoyment and to explain local culture and tourism to foreign visitors. Temple visits reliably provide the relaxation, prayer, and photography outcomes they want. By contrast, a Facebook-promoted Japanese festival promised Japanese culture and activities but felt primarily like a food festival with contemporary performances, leading the participant to leave within an hour and regard the visit as wasted time. That mismatch reduced their trust in event promotion and made them more selective, with attendance around once a month considered sufficient. They now reject events using AI-generated promotional images, read social-media feedback, and sometimes ask a trusted friend to attend first and report back privately through LINE. Some friends reportedly share the same uncertainty about whether promoted events will match reality. The central decision implication is that the observed need is not broader event discovery alone, but low-effort, credible evidence that an experience is authentic and matches its promotion before someone commits limited time.
