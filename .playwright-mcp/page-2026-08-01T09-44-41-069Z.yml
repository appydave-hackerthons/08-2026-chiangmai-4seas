    - generic [ref=e114]:
      - article [ref=e115]:
        - paragraph [ref=e116]: Opportunity hypothesis
        - heading "Where the evidence points" [level=2] [ref=e117]
        - paragraph [ref=e118]: A bounded hypothesis is that selective, time-constrained event seekers may value a lightweight credibility layer showing recent, real attendee evidence and a clear comparison between advertised and actual experiences. This could reduce dependence on sending trusted friends first while helping the participant identify culturally substantive events. The interview supports the behavior and workaround, but does not establish demand for a new product or willingness to contribute, trust, or pay.
        - generic [ref=e119]: Inference — validate before treating as fact
      - article [ref=e120]:
        - paragraph [ref=e121]: Least-effort next step
        - heading "What to do next" [level=2] [ref=e122]
        - paragraph [ref=e123]: Recruit the participant and four to six similarly selective Chiang Mai residents from their friend network. Show them five real event listings augmented only with recent attendee photos, a short "promised versus experienced" note, and source identity, then compare their attend-or-skip decisions and confidence with the original Facebook listings. Useful validation would be repeated decisions made without contacting a friend, accompanied by participants correctly explaining which evidence changed their confidence; absence of that behavior would weaken the hypothesis.
        - generic [ref=e124]: One useful test, not a roadmap
